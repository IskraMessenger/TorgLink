name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например 0.1.1 или v0.1.1 (будет создан на коммите выбранной ветки)'
        required: true
        type: string

jobs:
  build:
    name: Build all (Release)
    uses: ./.github/workflows/_build.yml
    with:
      configuration: Release
    secrets: inherit

  publish-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**
          generate_release_notes: true
